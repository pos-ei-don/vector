# Wegwerf-Sonde: gehoert NICHT in einen PR.
#
# Zweck: den windows_event_log-Patch auf einem echten Windows-Runner kompilieren und
# die Unit-Tests des Moduls fahren, OHNE dafuer einen PR bei vectordotdev/vector zu
# brauchen. Upstream laeuft der Windows-Job auf `windows-2025-8core` (Large Runner,
# in einem persoenlichen Fork nicht verfuegbar) und nur auf `pull_request`.
#
# Laeuft nur auf ci-probe/**-Branches, damit sie nichts anderes anfasst.
name: windows-compile-probe

on:
  push:
    branches:
      - "ci-probe/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-unit-test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Offizieller Upstream-Bootstrap: setzt Rust, protoc, LIBCLANG_PATH,
      # OPENSSL_SRC_PERL und PROTO_NO_VENDOR. Ohne ihn scheitert der Build in
      # proto-build mit "Could not find `protoc`" (Lauf #1).
      - run: .\scripts\environment\bootstrap-windows-2025.ps1

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-event-log-probe
          # Auch speichern, wenn ein spaeterer Schritt (z. B. rcedit) scheitert --
          # sonst baut jeder Folgelauf den teuren Release-Build erneut von vorn.
          cache-on-failure: true

      # Erst nur pruefen: faengt Compile-Fehler im Patch schnell, ohne die volle
      # Test-Kompilierung abzuwarten.
      - name: cargo check (sources-windows_event_log)
        run: cargo check -p vector --no-default-features --features sources-windows_event_log --lib

      # Dann die Unit-Tests des Moduls. Die Integrationstests brauchen Admin-Rechte
      # und einen beschreibbaren Application-Kanal -- die laufen upstream separat.
      - name: cargo test (windows_event_log unit tests)
        run: cargo test -p vector --no-default-features --features sources-windows_event_log --lib windows_event_log

      # Feldtest-Binary. Genau die Features, die die Pilot-Config auf VM-PWACKER
      # braucht -- nicht die Default-Features, das spart hier den Grossteil der
      # Bauzeit. Ziel ist NICHT ein Release, sondern eine vector.exe, mit der sich
      # auf dem Host messen laesst, der den Fehler urspruenglich reproduziert hat.
      - name: cargo build --release (Feldtest-Binary)
        run: >
          cargo build --release -p vector --no-default-features --features
          sources-windows_event_log,sources-internal_logs,sinks-socket,sinks-file,transforms-remap

      # Allowlist-Konformitaet fuer den Feldtest-Host: die IBF-G-DATA-Installation
      # laesst nur exen zu, die entweder auf der Whitelist stehen oder "IBF" im
      # LegalCopyright-Metatag tragen. Ohne das quarantaeniert AVKWCtl diese
      # selbstgebaute, unsignierte vector.exe sofort nach dem Ablegen -- der
      # Feldtest kaeme gar nicht zum Laufen.
      #
      # KEIN Umgehen fremder Schutzmassnahmen: eigenes Werkzeug, eigene Maschinen,
      # eigene AV-Policy (der Nutzer administriert die G-DATA-Instanz), und der
      # Copyright-Tag benennt die Herkunft wahrheitsgemaess. Nur ein Ressourcen-
      # Patch, kein Eingriff ins Programmverhalten -- rcedit statt build.rs, damit
      # der Quellcode-Patch unberuehrt bleibt.
      - name: rcedit holen
        run: choco install rcedit -y --no-progress

      - name: IBF-LegalCopyright setzen (G-DATA-Allowlist)
        shell: pwsh
        run: |
          $exe = "target/release/vector.exe"
          # Lauf 6 scheiterte, weil die feature-reduzierte cargo-Binary GAR KEINEN
          # VERSIONINFO-Block hat -- rcedit hatte keinen StringFileInfo, in den es
          # LegalCopyright schreiben konnte, und lieferte still leer zurueck.
          # --set-file-version / --set-product-version erzwingen den kompletten
          # VS_VERSION_INFO-Block; ERST dann greifen die --set-version-string.
          rcedit "$exe" `
            --set-file-version "0.58.0" `
            --set-product-version "0.58.0" `
            --set-version-string "CompanyName"    "IBF Solutions" `
            --set-version-string "ProductName"    "Vector (IBF Test-Build)" `
            --set-version-string "LegalCopyright" "IBF Solutions - internes Diagnose-Werkzeug (Test-Build zu vector#26118, nicht zur Verteilung)"
          # Gegenpruefung mit rcedits EIGENEM Getter, nicht ueber .NET-VersionInfo:
          # .NET liest je nach Codepage-Block u. U. leer, obwohl der Wert gesetzt ist.
          $lc = (rcedit "$exe" --get-version-string "LegalCopyright") -join ""
          "rcedit liest LegalCopyright = $lc"
          if ($lc -notlike "*IBF*") { throw "IBF fehlt im LegalCopyright -- Allowlist-Schritt gescheitert" }

      - name: vector.exe als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-windows-patched
          path: target/release/vector.exe
          retention-days: 3
